<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodePulse — Predictive Code Risk</title>
  <meta name="description" content="Predict which files in any GitHub repo are most likely to introduce bugs in the next 30 days." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Plotly -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" defer></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════
       STATE 1 — Input Screen
  ════════════════════════════════════════════════════════════ -->
  <main id="input-screen" role="main">

    <div class="hero-logo" aria-label="CodePulse">
      <!-- Pulse / lightning icon -->
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" rx="10" fill="#f97316" fill-opacity="0.12"/>
        <path d="M20 6L11 20H18L16 30L25 16H18L20 6Z" fill="#f97316" stroke="#f97316" stroke-width="0.5" stroke-linejoin="round"/>
      </svg>
      <span class="hero-wordmark">CodePulse</span>
    </div>

    <p class="hero-subtitle">
      Predict which files in any GitHub repo are most likely to introduce bugs.
    </p>

    <div class="input-group">
      <label for="repo-url" class="visually-hidden">GitHub repository URL</label>
      <input
        id="repo-url"
        type="url"
        class="url-input"
        placeholder="https://github.com/pallets/flask"
        autocomplete="off"
        spellcheck="false"
        autocorrect="off"
        autocapitalize="off"
      />

      <button id="analyze-btn" class="analyze-btn" type="button">
        Analyze →
      </button>

      <div id="loading-state" class="loading-state" aria-live="polite" aria-label="Loading">
        <div class="spinner" role="status"></div>
        <span>Analyzing repository…</span>
      </div>

      <div id="error-msg" class="error-msg" role="alert" aria-live="assertive">
        <!-- SVG X icon -->
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <circle cx="7" cy="7" r="6.5" stroke="#f85149"/>
          <path d="M4.5 4.5L9.5 9.5M9.5 4.5L4.5 9.5" stroke="#f85149" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span id="error-text"></span>
      </div>
    </div>

    <footer class="hero-footer" aria-label="Powered by">
      powered by PyDriller · XGBoost · SHAP
    </footer>

  </main>

  <!-- ═══════════════════════════════════════════════════════════
       STATE 2 — Results Dashboard
  ════════════════════════════════════════════════════════════ -->
  <div id="results-screen" aria-label="Analysis results">

    <!-- Sticky navbar -->
    <nav class="navbar" aria-label="CodePulse navigation">
      <a href="#" class="nav-logo" aria-label="CodePulse home" onclick="return false;">
        <svg width="24" height="24" viewBox="0 0 36 36" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <rect width="36" height="36" rx="10" fill="#f97316" fill-opacity="0.12"/>
          <path d="M20 6L11 20H18L16 30L25 16H18L20 6Z" fill="#f97316" stroke="#f97316" stroke-width="0.5" stroke-linejoin="round"/>
        </svg>
        <span class="nav-wordmark">CodePulse</span>
      </a>

      <button id="reset-btn" class="reset-btn" type="button" aria-label="Analyze another repository">
        <!-- Arrow left -->
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 2L4 7L9 12" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Analyze another repo
      </button>
    </nav>

    <!-- Main dashboard -->
    <div class="dashboard">

      <!-- Repo name -->
      <h1 id="repo-heading" class="repo-heading"></h1>

      <!-- Summary strip -->
      <div class="summary-strip" role="region" aria-label="Analysis summary">
        <div class="stat-card">
          <span class="stat-label">Files Analyzed</span>
          <span id="stat-total" class="stat-value">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">High Risk Files</span>
          <span id="stat-high-risk" class="stat-value high-risk">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Analyzed at</span>
          <span id="stat-time" class="stat-value" style="font-size:1.25rem">—</span>
        </div>
      </div>

      <!-- Risk Overview chart -->
      <section class="chart-section" aria-labelledby="chart-heading">
        <h2 id="chart-heading" class="section-header">Risk Overview</h2>
        <div id="risk-chart" role="img" aria-label="Top 10 riskiest files bar chart"></div>
      </section>

      <!-- File Risk Rankings table -->
      <section class="table-section" aria-labelledby="table-heading">
        <h2 id="table-heading" class="section-header">File Risk Rankings</h2>
        <div class="risk-table-wrapper">
          <table class="risk-table" aria-label="File risk rankings">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">File Path</th>
                <th scope="col">Risk Score</th>
                <th scope="col">Top Drivers</th>
              </tr>
            </thead>
            <tbody id="risk-table-body">
            </tbody>
          </table>
        </div>
      </section>

    </div><!-- /.dashboard -->
  </div><!-- /#results-screen -->

  <script src="js/app.js"></script>
</body>
</html>
